<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Pendaftaran Kelas SPK - Pemenang</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;600;700&display=swap" rel="stylesheet">
    <style>
        body { font-family: 'Inter', sans-serif; background-color: #1a202c; color: white; margin: 0; overflow-x: hidden; }
        .bg-custom {
            position: fixed; top: 0; left: 0; width: 100vw; height: 100vh;
            background-image: url('https://drive.google.com/uc?export=view&id=1XaESY6N8EKEMISiiPl4E78h9JqfCYlXB');
            background-size: cover; background-position: center; background-attachment: fixed; z-index: -2;
        }
        .bg-overlay {
            position: fixed; top: 0; left: 0; width: 100vw; height: 100vh;
            background: linear-gradient(to bottom, rgba(0, 0, 0, 0.7), rgba(0, 0, 0, 0.9)); z-index: -1;
        }
        .glass-card {
            background: rgba(255, 255, 255, 0.1); backdrop-filter: blur(12px);
            border: 1px solid rgba(255, 255, 255, 0.2); box-shadow: 0 8px 32px 0 rgba(0, 0, 0, 0.37);
        }
        .carousel-container { position: relative; width: 100%; max-width: 500px; margin: auto; overflow: hidden; border-radius: 1rem; }
        .carousel-slide { display: none; width: 100%; animation: fade 0.5s ease-in-out; }
        .carousel-slide.active { display: block; }
        .carousel-slide img { width: 100%; aspect-ratio: 1 / 1; object-fit: contain; background-color: rgba(0, 0, 0, 0.4); border-radius: 1rem; }
        @keyframes fade { from { opacity: 0.4 } to { opacity: 1 } }
        .form-input, .form-select { background: rgba(255, 255, 255, 0.05); border: 1px solid rgba(255, 255, 255, 0.3); color: white; transition: all 0.3s ease; }
        .form-input:focus, .form-select:focus { background: rgba(255, 255, 255, 0.1); border-color: #fbbf24; outline: none; box-shadow: 0 0 0 2px rgba(251, 191, 36, 0.3); }
        .form-select option { background-color: #1f2937; color: white; }
        .loader { border: 4px solid rgba(255,255,255,0.1); border-top: 4px solid #fbbf24; border-radius: 50%; width: 24px; height: 24px; animation: spin 1s linear infinite; display: inline-block; }
        @keyframes spin { 0% { transform: rotate(0deg); } 100% { transform: rotate(360deg); } }
        .hidden-view { display: none !important; }
    </style>
</head>
<body class="antialiased min-h-screen flex flex-col items-center">

    <div class="bg-custom"></div>
    <div class="bg-overlay"></div>

    <div id="custom-modal" class="fixed inset-0 z-50 flex items-center justify-center hidden-view">
        <div class="absolute inset-0 bg-black opacity-60" onclick="closeModal()"></div>
        <div class="glass-card p-8 rounded-2xl z-10 max-w-sm w-full mx-4 text-center transform transition-all">
            <h3 id="modal-title" class="text-2xl font-bold mb-4 text-amber-400">Pesan</h3>
            <p id="modal-message" class="text-gray-200 mb-6 font-light leading-relaxed"></p>
            <button onclick="closeModal()" class="w-full py-2 bg-gradient-to-r from-amber-500 to-amber-600 rounded-xl font-semibold hover:from-amber-400 hover:to-amber-500 transition-all text-gray-900">Tutup</button>
        </div>
    </div>

    <!-- HALAMAN DEPAN (LANDING) -->
    <main id="view-landing" class="w-full max-w-4xl px-4 py-12 flex flex-col items-center flex-grow">
        <div class="text-center mb-10">
            <img src="https://i.ibb.co.com/BKsx9NTP/Logo-SPK-New.png" alt="Logo SPK" class="w-32 h-auto mx-auto mb-6 drop-shadow-2xl">
            <h2 class="text-xl md:text-2xl font-semibold text-amber-400 tracking-wider mb-1">SPK PEMENANG</h2>
            <h1 class="text-3xl md:text-5xl font-bold text-white mb-4 drop-shadow-lg uppercase">SAYA PENGIKUT KRISTUS</h1>
            <h3 class="text-lg md:text-xl font-light text-gray-300 tracking-widest bg-black bg-opacity-50 inline-block px-4 py-1 rounded-full border border-gray-600">FORM PENDAFTARAN KELAS SPK</h3>
        </div>

        <button onclick="switchView('view-form')" class="mb-16 group relative px-8 py-4 bg-gradient-to-r from-amber-500 to-yellow-400 text-gray-900 text-lg md:text-xl font-bold rounded-full overflow-hidden shadow-[0_0_20px_rgba(251,191,36,0.4)] hover:shadow-[0_0_30px_rgba(251,191,36,0.6)] hover:scale-105 transition-all duration-300">
            <span class="relative z-10 flex items-center gap-2">
                <svg class="h-6 w-6" fill="none" viewBox="0 0 24 24" stroke="currentColor"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M11 5H6a2 2 0 00-2 2v11a2 2 0 002 2h11a2 2 0 002-2v-5m-1.414-9.414a2 2 0 112.828 2.828L11.828 15H9v-2.828l8.586-8.586z" /></svg>
                ISI FORM PENDAFTARAN
            </span>
            <div class="absolute inset-0 bg-white opacity-0 group-hover:opacity-20 transition-opacity duration-300"></div>
        </button>

        <div class="w-full text-center">
            <h4 class="text-gray-400 text-sm font-semibold uppercase tracking-widest mb-4 flex items-center justify-center gap-2">
                <span class="w-12 h-px bg-gray-600"></span>Pengumuman<span class="w-12 h-px bg-gray-600"></span>
            </h4>
            <div class="carousel-container shadow-2xl bg-black bg-opacity-50 p-2 border border-gray-700">
                <div id="carousel-slides-container"></div>
                <button onclick="changeSlide(-1)" class="absolute left-4 top-1/2 transform -translate-y-1/2 bg-black bg-opacity-60 text-white p-3 rounded-full hover:bg-amber-500 transition-colors"><svg class="h-6 w-6" fill="none" viewBox="0 0 24 24" stroke="currentColor"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M15 19l-7-7 7-7" /></svg></button>
                <button onclick="changeSlide(1)" class="absolute right-4 top-1/2 transform -translate-y-1/2 bg-black bg-opacity-60 text-white p-3 rounded-full hover:bg-amber-500 transition-colors"><svg class="h-6 w-6" fill="none" viewBox="0 0 24 24" stroke="currentColor"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M9 5l7 7-7 7" /></svg></button>
            </div>
        </div>
    </main>

    <!-- HALAMAN FORMULIR -->
    <main id="view-form" class="w-full max-w-3xl px-4 py-8 flex-grow hidden-view">
        <div class="flex items-center justify-between mb-8">
            <button onclick="switchView('view-landing')" class="flex items-center gap-2 text-gray-300 hover:text-amber-400 transition-colors">
                <svg class="h-5 w-5" fill="none" viewBox="0 0 24 24" stroke="currentColor"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M10 19l-7-7m0 0l7-7m-7 7h18" /></svg> Kembali
            </button>
            <img src="https://i.ibb.co.com/BKsx9NTP/Logo-SPK-New.png" alt="Logo" class="h-10 w-auto">
        </div>

        <div class="glass-card p-6 md:p-10 rounded-3xl">
            <h2 class="text-2xl md:text-3xl font-bold mb-2 text-amber-400">Form Pendaftaran</h2>
            <p class="text-gray-300 mb-8 text-sm">Silakan isi data diri Anda dengan lengkap dan benar.</p>

            <form id="registration-form" onsubmit="handleFormSubmit(event)" class="space-y-6">
                <!-- Data -->
                <div class="grid grid-cols-1 md:grid-cols-2 gap-6">
                    <div><label class="block text-sm font-medium text-gray-300 mb-1">Nama Lengkap *</label><input type="text" id="namaLengkap" required class="form-input w-full px-4 py-3 rounded-xl"></div>
                    <div><label class="block text-sm font-medium text-gray-300 mb-1">Nama Panggilan *</label><input type="text" id="namaPanggilan" required class="form-input w-full px-4 py-3 rounded-xl"></div>
                    <div><label class="block text-sm font-medium text-gray-300 mb-1">Tempat Lahir *</label><input type="text" id="tempatLahir" required class="form-input w-full px-4 py-3 rounded-xl"></div>
                    <div><label class="block text-sm font-medium text-gray-300 mb-1">Tanggal Lahir *</label><input type="date" id="tanggalLahir" required class="form-input w-full px-4 py-3 rounded-xl text-white" style="color-scheme: dark;"></div>
                </div>

                <div>
                    <label class="block text-sm font-medium text-gray-300 mb-1">Jenis Kelamin *</label>
                    <select id="jenisKelamin" required class="form-select w-full px-4 py-3 rounded-xl">
                        <option value="" disabled selected>Pilih Jenis Kelamin</option>
                        <option value="Laki-laki">Laki-laki</option><option value="Perempuan">Perempuan</option>
                    </select>
                </div>

                <div class="grid grid-cols-1 md:grid-cols-2 gap-6">
                    <div><label class="block text-sm font-medium text-gray-300 mb-1">No WA Aktif *</label><input type="tel" id="noWa" required placeholder="08xxxxxxxxxx" class="form-input w-full px-4 py-3 rounded-xl"></div>
                    <div><label class="block text-sm font-medium text-gray-300 mb-1">Email *</label><input type="email" id="email" required class="form-input w-full px-4 py-3 rounded-xl"></div>
                </div>

                <div class="grid grid-cols-1 md:grid-cols-2 gap-6">
                    <div>
                        <label class="block text-sm font-medium text-gray-300 mb-1">Fungsi *</label>
                        <select id="fungsi" required class="form-select w-full px-4 py-3 rounded-xl">
                            <option value="" disabled selected>Pilih Fungsi</option>
                            <option value="Peserta">Peserta</option><option value="Pembina">Pembina</option>
                        </select>
                    </div>
                    <div>
                        <label class="block text-sm font-medium text-gray-300 mb-1">Area Ibadah *</label>
                        <select id="areaIbadah" required class="form-select w-full px-4 py-3 rounded-xl">
                            <option value="" disabled selected>Pilih Area</option>
                            <option value="Umum">Umum</option><option value="Youth Pro">Youth Pro</option><option value="Youth Teens">Youth Teens</option><option value="Abbakids">Abbakids</option><option value="Tunas Bangsa">Tunas Bangsa</option>
                        </select>
                    </div>
                    <div>
                        <label class="block text-sm font-medium text-gray-300 mb-1">Status Baptisan *</label>
                        <select id="statusBaptisan" required class="form-select w-full px-4 py-3 rounded-xl">
                            <option value="" disabled selected>Pilih Status</option>
                            <option value="Belum">Belum</option><option value="Sudah">Sudah</option>
                        </select>
                    </div>
                    <div><label class="block text-sm font-medium text-gray-300 mb-1">PKS (Pembina Kelompok Sel) *</label><input type="text" id="pks" required placeholder="Nama PKS Anda" class="form-input w-full px-4 py-3 rounded-xl"></div>
                </div>

                <div class="pt-6">
                    <button type="submit" id="btn-submit" class="w-full py-4 bg-gradient-to-r from-amber-500 to-amber-600 text-gray-900 font-bold text-lg rounded-xl hover:from-amber-400 hover:to-amber-500 transition-all shadow-lg flex items-center justify-center gap-2">
                        <span>Kirim Pendaftaran</span>
                        <div id="submit-loader" class="loader hidden-view"></div>
                    </button>
                </div>
            </form>
        </div>
    </main>

    <footer class="w-full text-center py-4 text-gray-500 text-xs mt-auto">
        &copy; 2026 SPK Pemenang. <span onclick="bukaAdmin()" class="cursor-pointer hover:text-gray-300">Admin</span>
    </footer>

    <script>
        let slides = [];
        let slideIndex = 0;
        const modal = document.getElementById('custom-modal');

        function switchView(viewId) {
            document.getElementById('view-landing').classList.add('hidden-view');
            document.getElementById('view-form').classList.add('hidden-view');
            document.getElementById(viewId).classList.remove('hidden-view');
            window.scrollTo({ top: 0, behavior: 'smooth' });
        }

        function showModal(title, message, isSuccess = false) {
            document.getElementById('modal-title').innerText = title;
            document.getElementById('modal-title').className = isSuccess ? "text-2xl font-bold mb-4 text-emerald-400" : "text-2xl font-bold mb-4 text-amber-400";
            document.getElementById('modal-message').innerHTML = message;
            modal.classList.remove('hidden-view');
        }

        function closeModal() { modal.classList.add('hidden-view'); }

        // Buka halaman dashboard terpisah
        function bukaAdmin() {
            google.script.run.withSuccessHandler(function(url) {
                window.top.location.href = url + "?page=admin";
            }).getAppUrl();
        }

        function renderCarousel() {
            const container = document.getElementById('carousel-slides-container');
            container.innerHTML = '';
            if(slides.length === 0) return;
            slides.forEach((url, i) => {
                const div = document.createElement('div');
                div.className = `carousel-slide ${i === slideIndex ? 'active' : ''}`;
                div.innerHTML = `<img src="${url}" onerror="this.src='https://placehold.co/800x800/333/fff?text=Gambar+Gagal+Dimuat'">`;
                container.appendChild(div);
            });
        }

        function changeSlide(n) {
            if(slides.length <= 1) return;
            const els = document.querySelectorAll('.carousel-slide');
            els[slideIndex].classList.remove('active');
            slideIndex += n;
            if (slideIndex >= slides.length) slideIndex = 0;
            if (slideIndex < 0) slideIndex = slides.length - 1;
            els[slideIndex].classList.add('active');
        }

        function muatSlides() {
            google.script.run.withSuccessHandler(function(data) {
                slides = data;
                renderCarousel();
            }).getSlides();
        }

        setInterval(() => { if(!document.getElementById('view-landing').classList.contains('hidden-view')) changeSlide(1); }, 5000);
        muatSlides();

        function handleFormSubmit(e) {
            e.preventDefault();
            const btn = document.getElementById('btn-submit');
            const loader = document.getElementById('submit-loader');
            
            btn.disabled = true;
            btn.querySelector('span').innerText = 'Mengirim...';
            loader.classList.remove('hidden-view');

            const data = {
                namaLengkap: document.getElementById('namaLengkap').value,
                namaPanggilan: document.getElementById('namaPanggilan').value,
                tempatLahir: document.getElementById('tempatLahir').value,
                tanggalLahir: document.getElementById('tanggalLahir').value,
                jenisKelamin: document.getElementById('jenisKelamin').value,
                fungsi: document.getElementById('fungsi').value,
                areaIbadah: document.getElementById('areaIbadah').value,
                noWa: document.getElementById('noWa').value,
                email: document.getElementById('email').value,
                statusBaptisan: document.getElementById('statusBaptisan').value,
                pks: document.getElementById('pks').value
            };

            google.script.run
                .withSuccessHandler(function(response) {
                    btn.disabled = false;
                    btn.querySelector('span').innerText = 'Kirim Pendaftaran';
                    loader.classList.add('hidden-view');
                    
                    if(response.success) {
                        showModal("Berhasil!", "Terima kasih telah mengisi form, data anda berhasil di simpan.<br><br><span class='font-semibold text-white italic'>\"KETERBUKAAN ADALAH AWAL DARI PEMULIHAN\"</span>", true);
                        document.getElementById('registration-form').reset();
                        setTimeout(() => { closeModal(); switchView('view-landing'); }, 4000);
                    } else {
                        showModal("Gagal", "Sistem merespon: " + response.message);
                    }
                })
                .withFailureHandler(function(err) {
                    btn.disabled = false;
                    btn.querySelector('span').innerText = 'Kirim Pendaftaran';
                    loader.classList.add('hidden-view');
                    showModal("Koneksi Error", "Terjadi kegagalan jaringan, silakan coba lagi.");
                })
                .submitRegistration(data);
        }
    </script>
</body>
</html>
