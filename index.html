<!DOCTYPE html>
<html lang="id">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Form Pendaftaran</title>
  <script src="https://cdn.tailwindcss.com"></script>
</head>
<body class="bg-slate-100 min-h-screen flex items-center justify-center p-4">

  <div class="bg-white rounded-xl shadow-lg w-full max-w-md p-8">
    <div class="text-center mb-8">
      <h2 class="text-2xl font-bold text-slate-800">Form Pendaftaran</h2>
      <p class="text-slate-500 text-sm mt-1">Silakan lengkapi data diri Anda di bawah ini.</p>
    </div>

    <!-- Menghindari pemuatan ulang menggunakan onsubmit custom -->
    <div id="formWrapper" class="space-y-5">
      
      <div>
        <label class="block text-sm font-medium text-slate-700 mb-1">Nama Lengkap</label>
        <input type="text" id="nama" class="w-full px-4 py-2 border border-slate-300 rounded-lg focus:ring-2 focus:ring-blue-500 outline-none" placeholder="Masukkan nama Anda">
      </div>

      <div>
        <label class="block text-sm font-medium text-slate-700 mb-1">Jenis Kelamin</label>
        <select id="jk" class="w-full px-4 py-2 border border-slate-300 rounded-lg focus:ring-2 focus:ring-blue-500 outline-none">
          <option value="">Pilih Jenis Kelamin</option>
          <option value="Laki-laki">Laki-laki</option>
          <option value="Perempuan">Perempuan</option>
        </select>
      </div>

      <div>
        <label class="block text-sm font-medium text-slate-700 mb-1">Fungsi</label>
        <select id="fungsi" class="w-full px-4 py-2 border border-slate-300 rounded-lg focus:ring-2 focus:ring-blue-500 outline-none">
          <option value="">Pilih Fungsi</option>
          <option value="Peserta">Peserta</option>
          <option value="Pembina">Pembina</option>
        </select>
      </div>

      <div>
        <label class="block text-sm font-medium text-slate-700 mb-1">Status Baptis</label>
        <select id="baptis" class="w-full px-4 py-2 border border-slate-300 rounded-lg focus:ring-2 focus:ring-blue-500 outline-none">
          <option value="">Pilih Status</option>
          <option value="Sudah">Sudah</option>
          <option value="Belum">Belum</option>
        </select>
      </div>

      <button onclick="kirimData()" id="btnSubmit" class="w-full bg-blue-600 hover:bg-blue-700 text-white font-semibold py-3 rounded-lg transition duration-200 mt-4">
        Kirim Pendaftaran
      </button>

      <p id="pesanNotif" class="text-center text-sm font-medium hidden mt-4"></p>
    </div>
  </div>

  <script>
    function kirimData() {
      var nama = document.getElementById('nama').value;
      var jk = document.getElementById('jk').value;
      var fungsi = document.getElementById('fungsi').value;
      var baptis = document.getElementById('baptis').value;
      
      var btn = document.getElementById('btnSubmit');
      var notif = document.getElementById('pesanNotif');

      if (!nama || !jk || !fungsi || !baptis) {
        tampilNotif("Semua kolom wajib diisi!", "text-red-600");
        return;
      }

      btn.disabled = true;
      btn.innerText = "Mengirim...";
      btn.classList.add("opacity-50");

      var data = {
        nama: nama,
        jenisKelamin: jk,
        fungsi: fungsi,
        statusBaptis: baptis
      };

      google.script.run
        .withSuccessHandler(function(response) {
          if (response.success) {
            document.getElementById('nama').value = '';
            document.getElementById('jk').value = '';
            document.getElementById('fungsi').value = '';
            document.getElementById('baptis').value = '';
            tampilNotif("Pendaftaran Berhasil!", "text-green-600");
          } else {
            tampilNotif("Gagal: " + response.message, "text-red-600");
          }
          resetButton();
        })
        .withFailureHandler(function(error) {
          tampilNotif("Terjadi kesalahan sistem.", "text-red-600");
          resetButton();
        })
        .submitRegistration(data);
    }

    function tampilNotif(pesan, warna) {
      var notif = document.getElementById('pesanNotif');
      notif.innerText = pesan;
      notif.className = "text-center text-sm font-medium mt-4 " + warna;
      notif.style.display = "block";
      setTimeout(function() { notif.style.display = "none"; }, 4000);
    }

    function resetButton() {
      var btn = document.getElementById('btnSubmit');
      btn.disabled = false;
      btn.innerText = "Kirim Pendaftaran";
      btn.classList.remove("opacity-50");
    }
  </script>
</body>
</html>
